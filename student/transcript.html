<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript - School Management System</title>
    <link rel="stylesheet" href="/shared/index.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .page-header h2 {
            margin: 0;
            font-size: 1.4rem;
            color: #1e3a8a;
        }
        .page-header p {
            margin: 0.35rem 0 0;
            color: #6b7280;
            max-width: 640px;
            line-height: 1.5;
        }

        #transcriptStatus {
            padding: 2rem 0;
            text-align: center;
            color: #6b7280;
            font-size: 0.95rem;
        }

        .course-section {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 1.25rem;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.05);
        }
        .course-section + .course-section {
            margin-top: 1.5rem;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .course-header h3 {
            margin: 0;
            font-size: 1.15rem;
            color: #0f172a;
        }
        .course-header p {
            margin: 0.35rem 0 0;
            color: #64748b;
            font-size: 0.92rem;
        }

        .overall-average {
            min-width: 210px;
            padding: 1rem 1.1rem;
            border-radius: 12px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }
        .overall-average span {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #1d4ed8;
            text-transform: uppercase;
        }
        .overall-average strong {
            display: block;
            margin-top: 0.35rem;
            font-size: 2rem;
            color: #1e3a8a;
            line-height: 1;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 0.9rem;
            margin-bottom: 1.25rem;
        }
        .summary-card {
            padding: 0.95rem 1rem;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .summary-card span {
            display: block;
            color: #64748b;
            font-size: 0.82rem;
            margin-bottom: 0.35rem;
        }
        .summary-card strong {
            color: #0f172a;
            font-size: 1.25rem;
        }

        .transcript-table-wrapper {
            overflow-x: auto;
        }
        .transcript-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 580px;
        }
        .transcript-table th {
            padding: 0.75rem 1rem;
            border-bottom: 2px solid #dbeafe;
            background: #eff6ff;
            text-align: left;
            font-size: 0.84rem;
            color: #1e3a8a;
            white-space: nowrap;
        }
        .transcript-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #e5e7eb;
            color: #334155;
            font-size: 0.92rem;
            vertical-align: middle;
        }
        .transcript-table tr:last-child td {
            border-bottom: none;
        }
        .module-code {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            margin-right: 0.5rem;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 700;
            font-size: 0.78rem;
        }
        .average-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 96px;
            padding: 0.38rem 0.75rem;
            border-radius: 999px;
            background: #dcfce7;
            color: #166534;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .course-section {
                padding: 1rem;
            }
            .overall-average {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="menu-toggle" id="menuToggle"><span>☰</span></button>
        <h1 class="header-title">Transcript</h1>
        <div class="user-profile">
            <button class="profile-button" id="profileButton">
                <div class="profile-icon">S</div>
                <span class="profile-name">Student</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="logout-button" id="logoutButton">Logout</button>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <ul class="sidebar-nav">
            <li><a href="/student"><span class="nav-icon">📊</span> Dashboard</a></li>
            <li><a href="/student/schedule"><span class="nav-icon">📅</span> Class Schedule</a></li>
            <li><a href="/student/tasks"><span class="nav-icon">📋</span> Tasks</a></li>
            <li><a href="/student/transcript" class="active"><span class="nav-icon">📜</span> Transcript</a></li>
        </ul>
    </nav>

    <div class="overlay" id="overlay"></div>

    <main class="main-content" id="mainContent">
        <div class="content-card">
            <div class="page-header">
                <div>
                    <h2>📜 Academic Transcript</h2>
                    <p>Module averages are calculated from graded task submissions. The overall course average is the mean of the graded module averages for each enrolled course.</p>
                </div>
            </div>

            <div id="transcriptStatus">Loading transcript…</div>
            <div id="transcriptContent" style="display:none"></div>
        </div>
    </main>

    <script src="/shared/main.js"></script>
    <script src="transcript.js"></script>
</body>
</html>
