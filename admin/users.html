<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - School Management System</title>
    <link rel="stylesheet" href="/shared/index.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="menu-toggle" id="menuToggle">
            <span>☰</span>
        </button>
        <h1 class="header-title">User Management</h1>
        <div class="user-profile">
            <button class="profile-button" id="profileButton">
                <div class="profile-icon">A</div>
                <span class="profile-name">Admin</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#profile">My Profile</a>
                <a href="#settings">Settings</a>
                <div class="divider"></div>
                <button class="logout-button" id="logoutButton">Logout</button>
            </div>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <ul class="sidebar-nav">
            <li><a href="index.html"><span class="nav-icon">📊</span> Dashboard</a></li>
            <li><a href="users.html" class="active"><span class="nav-icon">👥</span> Manage Users</a></li>
            <li><a href="#students"><span class="nav-icon">👨‍🎓</span> Students</a></li>
            <li><a href="#lecturers"><span class="nav-icon">👨‍🏫</span> Lecturers</a></li>
            <li><a href="#courses"><span class="nav-icon">📚</span> Courses</a></li>
            <li><a href="#departments"><span class="nav-icon">🏛️</span> Departments</a></li>
            <li><a href="#enrollment"><span class="nav-icon">📝</span> Enrollment</a></li>
            <li><a href="#reports"><span class="nav-icon">📈</span> Reports</a></li>
            <li><a href="#settings"><span class="nav-icon">⚙️</span> System Settings</a></li>
        </ul>
    </nav>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="content-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h1>Manage Users</h1>
                <button id="addUserBtn" class="btn btn-primary">+ Add User</button>
            </div>

            <!-- Filter and Search -->
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <input type="text" id="searchUsers" placeholder="Search by name, email, or ID..." class="search-input" style="flex: 1; min-width: 200px;">
                <select id="filterStatus" class="filter-select" style="min-width: 150px;">
                    <option value="">All Users</option>
                    <option value="active">Active</option>
                    <option value="archived">Archived</option>
                </select>
            </div>

            <!-- Users Table -->
            <div class="table-container" style="overflow-x: auto;">
                <table class="users-table" style="width: 100%; border-collapse: collapse;">
                    <thead style="background: #f8f9fa;">
                        <tr>
                            <th style="padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0;">ID</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0;">Name</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0;">Email</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0;">Role</th>
                            <th style="padding: 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0;">Status</th>
                            <th style="padding: 12px; text-align: center; font-weight: 600; border-bottom: 2px solid #e0e0e0;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Users will be populated here -->
                    </tbody>
                </table>
            </div>
            <div id="paginationControls" style="margin-top: 1rem; display: flex; justify-content: flex-end;"></div>
        </div>
    </main>

    <!-- Add/Edit User Modal -->
    <div id="userModal" class="modal" style="display: none;">
        <div class="modal-content" style="background: white; border-radius: 8px; padding: 2rem; max-width: 500px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 id="modalTitle">Add User</h2>
                <button class="close-modal" onclick="closeUserModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666;">&times;</button>
            </div>
            <form id="userForm">
                <div style="margin-bottom: 1rem;">
                    <label for="userName" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Full Name *</label>
                    <input type="text" id="userName" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label for="userEmail" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email *</label>
                    <input type="email" id="userEmail" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label for="userRole" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Role *</label>
                    <select id="userRole" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
                        <option value="">Select a role</option>
                        <option value="admin">Admin</option>
                        <option value="lecturer">Lecturer</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label for="userPassword" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password <span id="passwordLabel">(leave empty to keep current)</span> *</label>
                    <input type="password" id="userPassword" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem;">
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" onclick="closeUserModal()" class="btn btn-secondary" style="padding: 0.75rem 1.5rem; border: 1px solid #ddd; background: #f5f5f5; border-radius: 4px; cursor: pointer;">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div id="modalOverlay" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 500;" onclick="closeUserModal()"></div>
    
    <script src="/shared/main.js"></script>
    <script src="/admin/users.js"></script>
</body>
</html>
