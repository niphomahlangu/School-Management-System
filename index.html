<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <button class="menu-toggle" id="menuToggle">
            <span>☰</span>
        </button>
        <h1 class="header-title">School Management System</h1>
        <div class="user-profile">
            <button class="profile-button" id="profileButton">
                <div class="profile-icon">U</div>
                <span class="profile-name">User Name</span>
                <span class="dropdown-arrow">▼</span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#profile">My Profile</a>
                <a href="#settings">Settings</a>
                <div class="divider"></div>
                <button class="logout-button" id="logoutButton">Logout</button>
            </div>
        </div>
    </header>

    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <ul class="sidebar-nav">
            <li><a href="#dashboard" class="active"><span class="nav-icon">📊</span> Dashboard</a></li>
            <li><a href="#students"><span class="nav-icon">👨‍🎓</span> Students</a></li>
            <li><a href="#teachers"><span class="nav-icon">👨‍🏫</span> Teachers</a></li>
            <li><a href="#classes"><span class="nav-icon">📚</span> Classes</a></li>
            <li><a href="#attendance"><span class="nav-icon">📝</span> Attendance</a></li>
            <li><a href="#grades"><span class="nav-icon">🎯</span> Grades</a></li>
            <li><a href="#schedule"><span class="nav-icon">📅</span> Schedule</a></li>
            <li><a href="#reports"><span class="nav-icon">📈</span> Reports</a></li>
        </ul>
    </nav>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="content-card">
            <h1>Welcome to School Management System</h1>
            <p>This is your dashboard. Use the navigation menu to access different sections of the system.</p>
        </div>
    </main>
    
    <script src="main.js"></script>
</body>
</html>
